name: Closed-Testing Preview (EAS Update)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish preview update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Install EAS CLI
        run: npm install -g eas-cli@19.0.1

      # NOTE: Auto-publishing OTA updates to the `main` (production) channel
      # on every push/PR has been intentionally REMOVED. Production OTA
      # updates are now a deliberate, MANUAL action so a merge to main can
      # never ship instantly to production users without review. To publish
      # a production OTA, either:
      #   • run locally:  eas update --branch main --message "..."
      #   • or trigger the "EAS Update (OTA)" workflow (eas-build.yml) via
      #     workflow_dispatch and choose branch: main.
      # Closed-testing (preview channel) still auto-updates below, since that
      # only reaches opt-in testers, not production users.

      - name: Publish EAS Update to preview branch (closed-testing)
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            MSG="PR #${PR_NUMBER}: ${PR_TITLE}"
          else
            MSG="Push to main: $(printf '%s' "$COMMIT_MSG" | head -n1)"
          fi
          eas update \
            --branch preview \
            --message "$MSG" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_VOCOLENS_API_KEY: ${{ secrets.EXPO_PUBLIC_VOCOLENS_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Comment on PR with preview info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const sha = context.sha.slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## 📱 OTA Preview Published`,
              ``,
              `Update published to the \`preview\` (closed-testing) channel.`,
              `Production (\`main\`) is published manually — see the "EAS Update (OTA)" workflow or run \`eas update --branch main\` locally.`,
              ``,
              `**To see the changes (closed-testing build):**`,
              `1. Open the **Vocolens** app on your phone`,
              `2. Force-close the app completely`,
              `3. Re-open it — the update downloads automatically`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Commit** | \`${sha}\` |`,
              `| **Channel** | \`preview\` (closed-testing) |`,
              `| **CI run** | [View logs](${runUrl}) |`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const prev = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('OTA Preview Published')
            );
            if (prev) {
              await github.rest.issues.updateComment({
                comment_id: prev.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
