name: EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message'
        required: false
        default: ''
      branch:
        description: 'Update branch (main, preview, or development)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - main
          - development
      environment:
        description: 'EAS environment to source env vars from (SDK 55+ requires this on eas update)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Publish EAS Update
        run: |
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="Manual OTA update: $(git log -1 --pretty=%s)"
          fi
          eas update \
            --branch ${{ github.event.inputs.branch }} \
            --environment ${{ github.event.inputs.environment }} \
            --message "$MSG" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # NOTE: --environment above tells EAS to pull EXPO_PUBLIC_* vars
          # (including EXPO_PUBLIC_ADAPTY_KEY) from the EAS-hosted
          # Environment Variables for that environment. The vars below are
          # a fallback only used if this repo's EAS project does NOT have
          # them configured as EAS-hosted vars for the chosen environment.
          EXPO_PUBLIC_ADAPTY_KEY: ${{ secrets.EXPO_PUBLIC_ADAPTY_KEY }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_VOCOLENS_API_KEY: ${{ secrets.EXPO_PUBLIC_VOCOLENS_API_KEY }}
          # Only include tester-skip flag when publishing to preview channel
          # (closed-testing testers). For main/production, this stays unset.
          EXPO_PUBLIC_ALLOW_TESTER_SKIP: ${{ github.event.inputs.branch == 'preview' && 'true' || '' }}
