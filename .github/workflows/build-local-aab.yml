name: Build AAB (Closed Testing)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Disable Android lint fatal abort
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties
          echo "android.enableR8.fullMode=false" >> android/gradle.properties
          echo "lintVitalAbortOnError=false" >> android/gradle.properties

      - name: Build AAB locally (closed-testing profile)
        run: eas build --platform android --profile closed-testing --local --output ./app-release.aab --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_VOCOLENS_API_KEY: ${{ secrets.EXPO_PUBLIC_VOCOLENS_API_KEY }}
          EXPO_PUBLIC_ADAPTY_KEY: ${{ secrets.EXPO_PUBLIC_ADAPTY_KEY }}
          EAS_NO_VCS: "1"
          ORG_GRADLE_PROJECT_lintVitalAbortOnError: "false"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocolens-closed-testing-aab
          path: ./app-release.aab
          retention-days: 14
